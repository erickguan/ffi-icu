# merge the default 'Exclude' key with ours
inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-minitest
  - rubocop-packaging

AllCops:
  NewCops: enable
  StyleGuideBaseURL: https://rubystyle.guide
  TargetRubyVersion: 3.2
  SuggestExtensions: false # reduce noise. consider add rubocop-benchmark

  Exclude:
    - bin/**/*
    - tmp/**/*

Bundler/OrderedGems:
  Include:
    - '*.gemspec'

# Allow no documentation.
Style/Documentation:
  Enabled: false

# Enforce single quotes in the gem
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/HashSyntax:
  EnforcedStyle: no_mixed_keys # consistent hash syntax
  EnforcedShorthandSyntax: consistent # enforce explicit hash syntax

# Enforce dots on the next line for multi-line method calls
Layout/DotPosition:
  EnforcedStyle: trailing

# Project maximum code line length
Layout/LineLength:
  Max: 120

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented

Style/SymbolArray:
  EnforcedStyle: brackets # Prefer brackets

Style/WordArray:
  EnforcedStyle: brackets # Prefer brackets

Style/FrozenStringLiteralComment:
  Enabled: false

# Exclude test files from BlockComments check
Style/BlockComments:
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  Max: 500

Metrics/BlockLength:
  Max: 50
  Exclude:
    # Generated tests exercise every locale and hour cycle.
    - test/**/*.rb

Metrics/AbcSize:
  Max: 110

Metrics/BlockNesting:
  Max: 5

Metrics/CyclomaticComplexity:
  Max: 40

Metrics/MethodLength:
  Max: 100

Metrics/ModuleLength:
  Max: 250
  Exclude:
    - test/**/*.rb
    - lib/ffi-icu/lib.rb

Metrics/PerceivedComplexity:
  Max: 50

Naming/MethodParameterName:
  Enabled: false

Naming/FileName:
  Exclude:
    - lib/ffi-icu.rb

# Require parentheses on assertions while leaving other method calls unchanged.
Style/MethodCallWithArgsParentheses:
  Enabled: true
  Include:
    - test/**/*.rb
  AllowedPatterns:
    - '\A(?!assert(?:_|\z))'

Minitest/AssertOperator:
  Enabled: true

# Prefer assert over refute.
Minitest/RefuteEmpty:
  Enabled: false

Minitest/RefuteEqual:
  Enabled: false

Minitest/RefuteFalse:
  Enabled: false

Minitest/RefuteInDelta:
  Enabled: false

Minitest/RefuteIncludes:
  Enabled: false

Minitest/RefuteInstanceOf:
  Enabled: false

Minitest/RefuteKindOf:
  Enabled: false

Minitest/RefuteMatch:
  Enabled: false

Minitest/RefuteNil:
  Enabled: false

Minitest/RefuteOperator:
  Enabled: false

Minitest/RefutePathExists:
  Enabled: false

Minitest/RefutePredicate:
  Enabled: false

Minitest/RefuteRespondTo:
  Enabled: false

Minitest/RefuteSame:
  Enabled: false

Minitest/MultipleAssertions:
  Max: 30
