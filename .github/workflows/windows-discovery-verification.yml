name: Windows discovery verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Discovery verification (${{ matrix.runner }}, Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        ruby: ['3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install official ICU beside ruby.exe
        shell: pwsh
        run: |
          $version = '78.3'
          $zipName = "icu4c-$version-Win64-MSVC2022.zip"
          $url = "https://github.com/unicode-org/icu/releases/download/release-$version/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $zipName
          Expand-Archive -Path $zipName -DestinationPath C:\icu -Force
          $rubyBin = (Get-Command ruby).Source | Split-Path
          Copy-Item C:\icu\bin64\icu*.dll -Destination $rubyBin -Force

      - name: Compare the original and fixed loader in fresh processes
        shell: pwsh
        run: |
          @'
          require 'open3'
          require 'rbconfig'
          require 'fileutils'
          $stdout.sync = true
          FileUtils.mkdir_p('tmp/discovery-verification')
          %w[original fixed].each do |mode|
            failures = 0
            50.times do |index|
              output, status = Open3.capture2e(RbConfig.ruby, '-Ilib', ARGV.first, mode)
              File.write("tmp/discovery-verification/#{mode}-#{index}.log", output)
              failures += 1 unless status.success?
              puts "[discovery-verification] mode=#{mode} iteration=#{index} exit=#{status.exitstatus}"
            end
            puts "[discovery-verification] RESULT mode=#{mode} failures=#{failures}/50"
            exit 1 if mode == 'fixed' && failures.positive?
          end
          '@ | Set-Content "$env:RUNNER_TEMP\driver.rb" -Encoding utf8
          @'
          $stdout.sync = true
          if ARGV.first == 'original'
            require 'fileutils'
            source = File.read('lib/ffi-icu/lib.rb')
            replacement = <<~RUBY
              def self.find_lib(lib)
                Dir.glob(search_paths.map { |path| File.expand_path(File.join(path, lib)) }).first
              end
            RUBY
            source = source.sub(/    def self.find_lib\(lib\).*?^    end/m, replacement)
            FileUtils.mkdir_p('tmp/original/ffi-icu')
            File.write('tmp/original/ffi-icu/lib.rb', source)
            $LOAD_PATH.unshift(File.expand_path('tmp/original'))
          end
          require 'ffi-icu'
          puts "ICU=#{ICU::Lib.version} libraries=#{ICU::Lib.ffi_libraries.map(&:name).join(',')}"
          require 'rspec/core'
          exit RSpec::Core::Runner.run(['--format', 'progress', 'spec'])
          '@ | Set-Content "$env:RUNNER_TEMP\verify.rb" -Encoding utf8
          bundle exec ruby "$env:RUNNER_TEMP\driver.rb" "$env:RUNNER_TEMP\verify.rb"

      - name: Save verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.runner }}-${{ matrix.ruby }}
          path: tmp/discovery-verification/
